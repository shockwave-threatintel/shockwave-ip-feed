name: Deploy Shockwave dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'release-status.json'
      - 'research-status.json'
      - 'shockwave-ipv4.txt'
      - 'shockwave.txt'
      - 'shockwave-annotated-preview.txt'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage approved public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html release-status.json research-status.json _site/

          # Publish the separately labelled annotated preview; never substitute it for shockwave.txt.
          if [ -s shockwave-annotated-preview.txt ]; then
            cp shockwave-annotated-preview.txt _site/
            echo "Annotated preview included as a separate download."
          else
            echo "Annotated preview missing or empty; continuing without preview."
          fi

          python3 - <<'PYTHON'
          import json
          import shutil
          from pathlib import Path

          # Sanitize only the public copy; keep source names in the private build input.
          preview = Path("_site/shockwave-annotated-preview.txt")
          if preview.is_file():
              lines = preview.read_text(encoding="utf-8").splitlines()
              cleaned = []
              removed = 0
              for line in lines:
                  low = line.lower()
                  pos = low.find("# sources:")
                  if pos < 0:
                      cleaned.append(line)
                      continue
                  removed += 1
                  prefix = line[:pos].rstrip()
                  vt = low.find("| virustotal:", pos)
                  if vt >= 0:
                      summary = line[vt + len("| virustotal:"):].strip().lstrip("# \\t").strip()
                      if summary:
                          cleaned.append((prefix + " " if prefix else "") + "# " + summary)
                      elif prefix:
                          cleaned.append(prefix)
                  elif prefix:
                      cleaned.append(prefix)
              if removed == 0:
                  raise SystemExit("No source annotations found; refusing to publish unsanitized preview.")
              if any("# sources:" in line.lower() for line in cleaned):
                  raise SystemExit("Source names remain; refusing to publish preview.")
              preview.write_text("\\n".join(cleaned) + "\\n", encoding="utf-8")
              print(f"Removed source names from {removed} public preview annotations.")

          status = json.loads(Path("release-status.json").read_text())
          state = status.get("status")

          if state == "not_published":
              print("Unpublished release: raw feed excluded from Pages artifact.")
          elif state == "published":
              feed = Path("shockwave.txt")
              if not feed.is_file() or feed.stat().st_size == 0:
                  raise SystemExit("Published status requires a non-empty feed.")
              shutil.copy2(feed, Path("_site") / feed.name)
              print("Approved published status: feed included in Pages artifact.")
          else:
              raise SystemExit(f"Invalid release status: {state!r}")
          PYTHON

      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
