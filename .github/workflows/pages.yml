name: Deploy Shockwave dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'release-status.json'
      - 'research-status.json'
      - 'shockwave-ipv4.txt'
      - 'shockwave.txt'
      - 'shockwave-annotated-preview.txt'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage approved public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html release-status.json research-status.json _site/

          # Publish the separately labelled annotated preview; never substitute it for shockwave.txt.
          if [ -s shockwave-annotated-preview.txt ]; then
            cp shockwave-annotated-preview.txt _site/
            echo "Annotated preview included as a separate download."
          else
            echo "Annotated preview missing or empty; continuing without preview."
          fi

          python3 - <<'PYTHON'
          import json
          import shutil
          from pathlib import Path

          # Normalize and sanitize only the public copy of the annotated preview.
          # The source file may contain literal backslash-n sequences from older builds.
          preview = Path("_site/shockwave-annotated-preview.txt")
          if preview.is_file():
              raw = preview.read_text(encoding="utf-8")
              raw = raw.replace("\\\\n", "\\n").replace("\\r\\n", "\\n").replace("\\r", "\\n")
              cleaned = []
              import re
              for line in raw.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  # Keep only lines beginning with a valid-looking IPv4 address.
                  match = re.match(r"^(\\d{1,3}(?:\\.\\d{1,3}){3})(.*)$", line)
                  if not match:
                      continue
                  ip, tail = match.groups()
                  # Extract only the VirusTotal summary if source labels are present.
                  low = tail.lower()
                  vt = low.find("| virustotal:")
                  if "# sources:" in low:
                      if vt >= 0:
                          tail = " # " + tail[vt + len("| virustotal:"):].strip().lstrip("# ").strip()
                      else:
                          tail = ""
                  tail = re.sub(r"\\s+", " ", tail).strip()
                  if tail and not tail.startswith("#"):
                      tail = "# " + tail.lstrip("|; ")
                  cleaned.append(ip + ((" " + tail) if tail else ""))
              if not cleaned:
                  raise SystemExit("Sanitization produced no valid IPv4 entries; refusing to publish preview.")
              if any("# sources:" in line.lower() or "| virustotal:" in line.lower() for line in cleaned):
                  raise SystemExit("Source labels remain; refusing to publish preview.")
              preview.write_text("\\n".join(cleaned) + "\\n", encoding="utf-8")
              print(f"Normalized public preview to {len(cleaned)} IPv4 entries without source labels.")
          status = json.loads(Path("release-status.json").read_text())
          state = status.get("status")

          if state == "not_published":
              print("Unpublished release: raw feed excluded from Pages artifact.")
          elif state == "published":
              feed = Path("shockwave.txt")
              if not feed.is_file() or feed.stat().st_size == 0:
                  raise SystemExit("Published status requires a non-empty feed.")
              shutil.copy2(feed, Path("_site") / feed.name)
              print("Approved published status: feed included in Pages artifact.")
          else:
              raise SystemExit(f"Invalid release status: {state!r}")
          PYTHON

      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
